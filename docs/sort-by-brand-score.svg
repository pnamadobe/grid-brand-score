        <rect x="0" y="0" width="130" height="110" rx="8" fill="#ececec"/>
        <rect x="35" y="0" width="60" height="110" fill="#6f8fb3"/><rect x="35" y="62" width="60" height="48" fill="#1d2b4f"/><rect x="45" y="72" width="40" height="7" fill="#fff"/><rect x="50" y="83" width="30" height="6" fill="#d7373f"/>
        <rect x="6" y="6" width="22" height="14" rx="7" fill="#fff"/><text x="17" y="16.5" font-size="8.5" font-weight="800" text-anchor="middle" fill="#222">#1</text>
        <rect x="92" y="88" width="32" height="16" rx="8" fill="#0f7d55"/><text x="108" y="99.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">90.7</text>
        <text x="8" y="128" font-weight="700" fill="#222">APP_CARD_890x1335_</text>
        <text x="8" y="140" font-weight="700" fill="#222">solo-adventurer.jpg</text>
        <text x="8" y="158" fill="#555" font-size="9">The strongest single image —</text>
        <text x="8" y="170" fill="#555" font-size="9">aspirational lone hiker, clean</text>
        <text x="8" y="182" fill="#555" font-size="9">horizon. Governance: 6/7 pass…</text>
        <text x="8" y="200" fill="#1473e6" font-size="9">More</text>
      </g>
      <g transform="translate(156,146)">
        <rect width="130" height="214" rx="8" fill="#fff" stroke="#e3e3e3"/>
        <rect x="0" y="0" width="130" height="110" rx="8" fill="#ececec"/>
        <rect x="35" y="0" width="60" height="110" fill="#c69b77"/><rect x="35" y="62" width="60" height="48" fill="#1d2b4f"/><rect x="45" y="72" width="40" height="7" fill="#fff"/><rect x="50" y="83" width="30" height="6" fill="#d7373f"/>
        <rect x="6" y="6" width="22" height="14" rx="7" fill="#fff"/><text x="17" y="16.5" font-size="8.5" font-weight="800" text-anchor="middle" fill="#222">#2</text>
        <rect x="92" y="88" width="32" height="16" rx="8" fill="#0f7d55"/><text x="108" y="99.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">90.1</text>
        <text x="8" y="128" font-weight="700" fill="#222">APP_CARD_890x1335_</text>
        <text x="8" y="140" font-weight="700" fill="#222">beach-couple.jpg</text>
        <text x="8" y="158" fill="#555" font-size="9">Warm sunset beach selfie —</text>
        <text x="8" y="170" fill="#555" font-size="9">strong emotional pull, clearly</text>
        <text x="8" y="182" fill="#555" font-size="9">on-message for leisure travel…</text>
        <text x="8" y="200" fill="#1473e6" font-size="9">More</text>
      </g>
      <g transform="translate(294,146)">
        <rect width="130" height="214" rx="8" fill="#fff" stroke="#e3e3e3"/>
        <rect x="0" y="0" width="130" height="110" rx="8" fill="#ececec"/>
        <rect x="0" y="30" width="130" height="50" fill="#7f9c8a"/><rect x="70" y="30" width="60" height="50" fill="#1d2b4f"/><rect x="78" y="40" width="44" height="6" fill="#fff"/><rect x="83" y="50" width="34" height="5" fill="#d7373f"/>
        <rect x="6" y="6" width="22" height="14" rx="7" fill="#fff"/><text x="17" y="16.5" font-size="8.5" font-weight="800" text-anchor="middle" fill="#222">#3</text>
        <rect x="92" y="88" width="32" height="16" rx="8" fill="#0f7d55"/><text x="108" y="99.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">89.9</text>
        <text x="8" y="128" font-weight="700" fill="#222">WEB_HP_SLIDER_1440x</text>
        <text x="8" y="140" font-weight="700" fill="#222">500_foodie-europe.jpg</text>
        <text x="8" y="158" fill="#555" font-size="9">Intimate cafe moment, rich</text>
        <text x="8" y="170" fill="#555" font-size="9">warm tones, strongly on-brand</text>
        <text x="8" y="182" fill="#555" font-size="9">for experiential travel…</text>
        <text x="8" y="200" fill="#1473e6" font-size="9">More</text>
      </g>
      <g transform="translate(432,146)">
        <rect width="130" height="214" rx="8" fill="#fff" stroke="#e3e3e3"/>
        <rect x="0" y="0" width="130" height="110" rx="8" fill="#ececec"/>
        <rect x="25" y="10" width="80" height="90" fill="#8a7a6a"/><rect x="25" y="62" width="80" height="38" fill="#1d2b4f"/><rect x="38" y="70" width="54" height="6" fill="#fff"/><rect x="45" y="80" width="40" height="5" fill="#d7373f"/>
        <rect x="6" y="6" width="22" height="14" rx="7" fill="#fff"/><text x="17" y="16.5" font-size="8.5" font-weight="800" text-anchor="middle" fill="#222">#4</text>
        <rect x="92" y="88" width="32" height="16" rx="8" fill="#0f7d55"/><text x="108" y="99.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">89.7</text>
        <text x="8" y="128" font-weight="700" fill="#222">APP_CARD_890x1335_</text>
        <text x="8" y="140" font-weight="700" fill="#222">ski-couple.jpg</text>
        <text x="8" y="158" fill="#555" font-size="9">High-energy snow selfie; the</text>
        <text x="8" y="170" fill="#555" font-size="9">red phone adds a pop and the</text>
        <text x="8" y="182" fill="#555" font-size="9">winter setting is on-season…</text>
        <text x="8" y="200" fill="#1473e6" font-size="9">More</text>
